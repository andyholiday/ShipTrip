<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1320, initial-scale=1" />
    <title>ShipTrip 1.9 — App Store Screenshot „Widgets"</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; background: #0B1622; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; }

      /* Raster und Tonwerte aus marketing/release-1.7.0/app-store-v2/template.html */
      .shot { position: relative; width: 1320px; height: 2868px; overflow: hidden; isolation: isolate; color: #FBF7F0; }
      .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3; }
      .wash { position: absolute; inset: 0; z-index: -2;
              background: linear-gradient(180deg, rgba(9,35,70,.10), rgba(5,24,52,.32) 42%, rgba(4,18,40,.88)); }

      .brand { position: absolute; top: 92px; left: 92px; display: flex; align-items: center; gap: 23px;
               font-size: 27px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
      .brand img { width: 68px; height: 68px; border-radius: 16px; }

      .headline { position: absolute; top: 230px; left: 92px; right: 74px; margin: 0;
                  font-size: 105px; line-height: .98; letter-spacing: -.046em; font-weight: 820; }
      .headline .accent { color: #FF6B35; }
      .subhead { position: absolute; top: 482px; left: 96px; right: 90px; margin: 0;
                 font-size: 38px; line-height: 1.24; letter-spacing: -.018em; font-weight: 560; opacity: .88; }
      .feature-tag { position: absolute; top: 622px; left: 96px; display: inline-flex; align-items: center; gap: 16px;
                     padding: 16px 22px; border: 2px solid currentColor; border-radius: 999px;
                     font-size: 24px; font-weight: 720; letter-spacing: .08em; text-transform: uppercase; }
      .feature-tag::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #FF6B35; }

      /* Die beiden Bühnen: Home- und Sperrbildschirm als Flächen auf dem Ozean-Grund. */
      .stage { position: absolute; left: 60px; width: 1200px; border-radius: 88px;
               background: rgba(6,22,42,.34); border: 2px solid rgba(255,255,255,.10);
               box-shadow: inset 0 2px 0 rgba(255,255,255,.06); backdrop-filter: blur(10px) saturate(1.05); }
      .stage.home { top: 860px; height: 1300px; }
      .stage.lock { top: 2220px; height: 460px; }

      .stage-label { position: absolute; font-size: 25px; font-weight: 740; letter-spacing: .17em;
                     text-transform: uppercase; opacity: .74; display: flex; align-items: center; gap: 15px; }
      .stage-label::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: #FF6B35; }
      .home .stage-label { left: 116px; top: 88px; }
      .lock .stage-label { left: 0; right: 0; top: 72px; justify-content: center; }

      /* Die PNGs tragen den Galerie-Grund (#F2F2F7) in den Ecken. Der Clip-Radius
         liegt leicht über dem gerenderten Radius (55 px im Bild), damit kein heller
         Saum stehen bleibt. */
      .tile { position: absolute; overflow: hidden;
              box-shadow: 0 34px 68px rgba(3,16,34,.52), 0 6px 16px rgba(3,16,34,.34); }
      .tile img { display: block; width: calc(100% + 10px); height: calc(100% + 10px); margin: -5px; }
      .tile.medium { left: 116px; top: 150px; width: 1088px; height: 508px; border-radius: 58px; }
      .tile.small  { left: 116px; top: 700px; width: 508px; height: 508px; border-radius: 58px; }
      .tile.rect   { left: 343px; top: 140px; width: 514px; height: 227px; border-radius: 58px; }

      .app-slot { position: absolute; left: 712px; top: 700px; width: 220px;
                  display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .app-slot img { width: 180px; height: 180px; border-radius: 40px;
                      box-shadow: 0 22px 44px rgba(3,16,34,.46); }
      .app-slot span { font-size: 30px; font-weight: 600; letter-spacing: -.01em; opacity: .92; }

      .footer-mark { position: absolute; right: 50px; bottom: 44px; font-size: 22px; font-weight: 720;
                     letter-spacing: .14em; text-transform: uppercase; opacity: .72; z-index: 8; }
    </style>
  </head>
  <body>
    <main id="shot" class="shot">
      <img class="backdrop" src="assets/backdrop-ocean.png" alt="" />
      <div class="wash"></div>

      <div class="brand"><img src="assets/app-icon.png" alt="" /><span>ShipTrip</span></div>
      <h1 id="headline" class="headline"></h1>
      <p id="subhead" class="subhead"></p>
      <div id="tag" class="feature-tag"></div>

      <section class="stage home">
        <div id="label-home" class="stage-label"></div>
        <div class="tile medium"><img id="w-medium" alt="ShipTrip Medium-Widget" /></div>
        <div class="tile small"><img id="w-small" alt="ShipTrip Small-Widget" /></div>
        <div class="app-slot"><img src="assets/app-icon.png" alt="" /><span>ShipTrip</span></div>
      </section>

      <section class="stage lock">
        <div id="label-lock" class="stage-label"></div>
        <div class="tile rect"><img id="w-rect" alt="ShipTrip Sperrbildschirm-Widget" /></div>
      </section>

      <div class="footer-mark">Version 1.9</div>
    </main>

    <script>
      const copy = {
        de: {
          headline: "Deine Reise<br><span class='accent'>auf einen Blick.</span>",
          subhead: "Countdown, aktueller Hafen und nächster Stopp – als Widget auf Home- und Sperrbildschirm.",
          tag: "Neu · Widgets",
          home: "Home-Bildschirm",
          lock: "Sperrbildschirm"
        },
        en: {
          headline: "Your voyage<br><span class='accent'>at a glance.</span>",
          subhead: "Countdown, current port and next stop – as widgets on your Home and Lock Screen.",
          tag: "New · Widgets",
          home: "Home Screen",
          lock: "Lock Screen"
        }
      };
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "de";
      const suffix = lang === "en" ? "en" : "de";
      const t = copy[lang];
      document.documentElement.lang = lang;
      document.querySelector("#headline").innerHTML = t.headline;
      document.querySelector("#subhead").textContent = t.subhead;
      document.querySelector("#tag").textContent = t.tag;
      document.querySelector("#label-home").textContent = t.home;
      document.querySelector("#label-lock").textContent = t.lock;
      document.querySelector("#w-medium").src = `assets/widget-medium-active-${suffix}-light-L.png`;
      document.querySelector("#w-small").src = `assets/widget-small-countdown-${suffix}-light-L.png`;
      document.querySelector("#w-rect").src = `assets/widget-rectangular-active-${suffix}-light-L.png`;
    </script>
  </body>
</html>
